[package]
name = "kampus-canvas"
description = "Synthetic Canvas-shaped fake and client: DeadlineProvider (sandbox only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Everything in this crate is sandbox-only: without the feature it compiles to
# an empty library and pulls in none of the optional dependencies below.
sandbox = [
    "kampus-core/sandbox",
    "dep:axum",
    "dep:chrono",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:url",
]

[dependencies]
kampus-core.workspace = true
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[lints]
workspace = true
