[package]
name = "kampus-auth"
description = "kampus authorization broker: a small OAuth 2.1 authorization server for MCP clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Synthetic demo users and the loopback CIMD exception for tests. Still
# requires `sandbox.enabled: true` at runtime.
sandbox = ["kampus-core/sandbox"]
# Exposes the pure request parsers to the cargo-fuzz crate in `fuzz/`.
fuzzing = []

[dependencies]
kampus-core.workspace = true
askama.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
chrono.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
openidconnect.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
serde-saphyr.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
