[package]
name = "kampus"
description = "kampus: a policy-controlled campus connector for AI assistants (MCP server)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Demo build: synthetic providers, booking simulation and Flight replay become
# reachable (still requires `sandbox.enabled: true` at runtime).
sandbox = [
    "kampus-core/sandbox",
    "kampus-rooms/sandbox",
    "kampus-transit-tools/sandbox",
    "kampus-deadlines/sandbox",
    "kampus-device/sandbox",
    "kampus-auth?/sandbox",
]
# The kampus authorization broker on its own listener (`auth.broker` in
# school.yaml). Demo build: `--features sandbox,broker`.
broker = ["dep:kampus-auth"]
# Development acceptance only: adds the `kampus_hello` tool. Never in the demo build.
acceptance = []

[dependencies]
kampus-core.workspace = true
kampus-device.workspace = true
kampus-rooms.workspace = true
kampus-courses.workspace = true
kampus-transit-tools.workspace = true
kampus-library-hours.workspace = true
kampus-deadlines.workspace = true
kampus-auth = { workspace = true, optional = true }
axum.workspace = true
chrono.workspace = true
http.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Locally generated signing keys for the auth tests.
aws-lc-rs.workspace = true
# Broker tests: token header inspection and inline broker configuration.
jsonwebtoken.workspace = true
serde-saphyr.workspace = true
# rmcp's own OAuth client and Streamable HTTP client for the broker e2e test
# (auth-broker decision 13); the production feature set is unchanged.
rmcp = { workspace = true, features = ["auth", "client", "transport-streamable-http-client-reqwest"] }

# The authorization broker end to end (auth-broker change).
[[test]]
name = "broker"
required-features = ["broker"]

# Multi-school instance tests; contents owned by the multi-school change.
[[test]]
name = "instances"
path = "../../tests/instances/main.rs"

[lints]
workspace = true
