# kampus VM stack: Keycloak (authorization server) + Postgres + Caddy (HTTPS).
# The kampus binary runs on the host (systemd or tmux) on 127.0.0.1:8080;
# Caddy proxies https://${KAMPUS_DOMAIN} to it. See README.md.
name: kampus-auth

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Stable public issuer: https://${AUTH_DOMAIN}/realms/kampus
      KC_HOSTNAME: https://${AUTH_DOMAIN:?set in .env}
      # Admin console only via SSH tunnel to 127.0.0.1:8180 (Caddy blocks /admin).
      KC_HOSTNAME_ADMIN: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set in .env}
      # Placeholders resolved by Keycloak inside realm-kampus.json at import.
      KAMPUS_DOMAIN: ${KAMPUS_DOMAIN:?set in .env}
      KAMPUS_AUDIENCE: ${KAMPUS_AUDIENCE:-kampus-temple}
      KAMPUS_CLAUDE_SECRET: ${KAMPUS_CLAUDE_SECRET:?set in .env}
      KAMPUS_CHATGPT_SECRET: ${KAMPUS_CHATGPT_SECRET:?set in .env}
      KAMPUS_MASCOT_SECRET: ${KAMPUS_MASCOT_SECRET:?set in .env}
      KAMPUS_DEMO_PASSWORD: ${KAMPUS_DEMO_PASSWORD:?set in .env}
    volumes:
      - ./realm-kampus.json:/opt/keycloak/data/import/realm-kampus.json:ro
    ports:
      - "127.0.0.1:8180:8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [keycloak]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      KAMPUS_DOMAIN: ${KAMPUS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
