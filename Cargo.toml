[workspace]
resolver = "3"
members = [
    "crates/kampus",
    "crates/kampus-core",
    "crates/kampus-libcal",
    "crates/kampus-banner",
    "crates/kampus-transit",
    "crates/kampus-hours",
    "crates/kampus-canvas",
    "crates/kampus-device",
    "modules/rooms",
    "modules/courses",
    "modules/transit",
    "modules/library-hours",
    "modules/deadlines",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

# Shared dependency versions. Adding or changing an entry is an integrator
# change (see AGENTS.md); module crates use `dep.workspace = true`.
[workspace.dependencies]
# MCP SDK: exact pin. Read docs/vendor/rmcp/ before touching rmcp code.
rmcp = { version = "=3.4.1", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
axum = "0.8.9"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = "1.3.0"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10.4"
jsonschema = { version = "0.58.1", default-features = false }
scraper = "0.27.0"
url = { version = "2.5.8", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
http = "1.5"
# Auth (auth-policy-audit; reserved in docs/development, integrator review):
# JWT verification on the aws-lc-rs backend rustls already builds, and
# HMAC-SHA256 for salted audit subject hashes.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = "1.18.1"

# Workspace crates.
kampus-core = { path = "crates/kampus-core" }
kampus-libcal = { path = "crates/kampus-libcal" }
kampus-banner = { path = "crates/kampus-banner" }
kampus-transit = { path = "crates/kampus-transit" }
kampus-hours = { path = "crates/kampus-hours" }
kampus-canvas = { path = "crates/kampus-canvas" }
kampus-device = { path = "crates/kampus-device" }
kampus-rooms = { path = "modules/rooms" }
kampus-courses = { path = "modules/courses" }
kampus-transit-tools = { path = "modules/transit" }
kampus-library-hours = { path = "modules/library-hours" }
kampus-deadlines = { path = "modules/deadlines" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panicking shortcuts are banned outside tests (tests opt out via clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic lints that fight the codebase's conventions:
# every public fallible fn documents its error type instead of an `# Errors` section.
missing_errors_doc = "allow"
# `# Panics` sections are moot: library code must not panic.
missing_panics_doc = "allow"
# Re-exported module names (config::SchoolConfig) are the clearest names here.
module_name_repetitions = "allow"
# Builders and DTO constructors return values callers may deliberately drop.
must_use_candidate = "allow"

[profile.dev]
# Faster incremental builds for parallel worktrees; dependencies keep some optimization.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
