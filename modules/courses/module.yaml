# courses module, version 1. Contract: openspec/changes/public-courses/design.md
version: 1
id: courses
tools:
  - name: search_courses
    title: Search the course catalog
    description: Search public class sections for a term by subject code and/or keywords.
    data_class: public
    roles: [student, faculty, staff, guest]
    write: false
    scopes: []
    readOnlyHint: true
    destructiveHint: false
    input_schema:
      type: object
      additionalProperties: false
      anyOf:
        - required: [subject]
        - required: [query]
      properties:
        term: { type: string, maxLength: 16, description: "Configured term code; defaults to the school's current term." }
        subject: { type: string, pattern: '^[A-Za-z]{1,8}$' }
        query: { type: string, minLength: 1, maxLength: 120 }
        page: { type: integer, minimum: 1, maximum: 100, default: 1 }
        page_size: { type: integer, minimum: 1, maximum: 20, default: 10 }
    output_schema:
      type: object
      additionalProperties: false
      required: [term, term_label, sections, page, page_size, total_count, has_more]
      properties:
        term: { type: string, maxLength: 16, description: "The term code that was searched." }
        term_label: { type: [string, "null"], maxLength: 32, description: "The term's display name from the catalog, such as \"2026 Fall\"; null when no section reports one." }
        sections:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [section_id, subject, course_number, section_number, title, credits, meetings]
            properties:
              section_id: { type: string, maxLength: 64 }
              subject: { type: string, maxLength: 16 }
              course_number: { type: string, maxLength: 16 }
              section_number: { type: string, maxLength: 16 }
              title: { type: string, maxLength: 160 }
              credits: { type: [number, "null"], minimum: 0 }
              meetings:
                type: array
                maxItems: 10
                items:
                  type: object
                  additionalProperties: false
                  required: [days, start_time, end_time, location]
                  properties:
                    days: { type: array, maxItems: 7, items: { enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun] } }
                    start_time: { type: [string, "null"], maxLength: 16 }
                    end_time: { type: [string, "null"], maxLength: 16 }
                    location: { type: [string, "null"], maxLength: 160 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 20 }
        total_count: { type: [integer, "null"], minimum: 0 }
        has_more: { type: boolean }
