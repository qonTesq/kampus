# library-hours module, version 1. Contract: openspec/changes/archive/2026-09-28-public-library-hours/design.md
version: 1
id: library_hours
tools:
  - name: library_hours
    title: Library opening hours
    description: Opening hours for a campus library on a given date.
    data_class: public
    roles: [student, faculty, staff, guest]
    write: false
    scopes: []
    readOnlyHint: true
    destructiveHint: false
    input_schema:
      type: object
      additionalProperties: false
      properties:
        library_id: { type: string, maxLength: 64, description: "Configured library ID; defaults to the main library." }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: "YYYY-MM-DD; defaults to today at the school." }
    output_schema:
      type: object
      additionalProperties: false
      required: [library_id, name, date, timezone, status, intervals, note]
      properties:
        library_id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 160 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        timezone: { type: string, maxLength: 64 }
        status: { enum: [open, closed, unknown] }
        intervals:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [opens_at, closes_at]
            properties:
              opens_at: { type: string, format: date-time }
              closes_at: { type: string, format: date-time }
        note: { type: [string, "null"], maxLength: 500 }
