name: server

# The Rust MCP server. Runs only when server code, its config or its test data change.
on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "adapters/**"
      - "modules/**"
      - "schools/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "crates/**"
      - "adapters/**"
      - "modules/**"
      - "schools/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".github/workflows/server.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - run: cargo fmt --all -- --check

  check:
    name: clippy + test (${{ matrix.build }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: production
            features: ""
          - build: sandbox
            features: "--features kampus/sandbox"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.build }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings
      - name: Test
        run: cargo test --workspace ${{ matrix.features }}
