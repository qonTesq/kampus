# Local development instance. See README.md for HTTPS and sign-in setup.
version: 1
school:
  id: sju
  display_name: Saint Joseph's University
  timezone: America/New_York
server:
  resource_url: http://127.0.0.1:8090/mcp
  listen: 127.0.0.1:8090
  admin_listen: 127.0.0.1:8091
auth:
  mode: oauth
  # SJU's kampus authorization broker. This checked-in file has no
  # auth.broker section: public tools work without a token and protected
  # calls get 401. Add one per docs/auth/broker.md and school-idp.md.
  issuer: http://127.0.0.1:8092/auth
# No courses: SJU's public class schedule is Banner 8 HTML, not the Banner 9
# SSB JSON the banner adapter reads (openspec/changes/archive/2026-10-10-sju-parity/design.md).
# deadlines has no source here (no canvas section; production builds never
# have one): it answers unsupported_source. Demo profile: README.md.
modules: [rooms, transit, library_hours, deadlines]
sandbox:
  enabled: false
libcal:
  enabled: true
  base_url: https://sju.libcal.com
  locations:
    - id: "20094"
      name: Drexel Library, Hawk Hill Campus
      aliases: [Hawk Hill, Drexel Library, Post Learning Commons]
    - id: "20098"
      name: University City Campus
      aliases: [University City]
  default_location: "20094"
  booking_simulation: false
# LibCal's public hours-widget JSON, the data behind sju.libcal.com/hours
# (iid 6480; hours location IDs differ from the space IDs above).
hours:
  enabled: true
  libraries:
    - id: hawk-hill
      name: Drexel Library, Hawk Hill Campus
      url: https://sju.libcal.com/widget/hours/grid?iid=6480&format=json&weeks=8&systemTime=0
      parser:
        profile: libcal-hours-grid
        selectors: { lid: "22788" }
      aliases: [Hawk Hill, Drexel Library, Post Learning Commons]
    - id: university-city
      name: University City Campus library
      url: https://sju.libcal.com/widget/hours/grid?iid=6480&format=json&weeks=8&systemTime=0
      parser:
        profile: libcal-hours-grid
        selectors: { lid: "22789" }
      aliases: [University City]
  default_library: hawk-hill
transit:
  enabled: true
  providers:
    - id: septa_rail
      kind: septa_arrivals
      base_url: https://www3.septa.org
  stops:
    - id: Overbrook
      name: Overbrook Station
      provider: septa_rail
      aliases: [Overbrook Station, Hawk Hill rail]
  routes: []
devices: []
