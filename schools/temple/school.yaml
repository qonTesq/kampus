# Temple University: the reference school (school.yaml version 1).
# Values come from docs/research/campus-ai-connector-report.md section 4 (verified 2026-09-26).
# Secrets are never written here; *_env fields name environment variables.
#
# server/auth below are LOCAL DEVELOPMENT values. For the VM, set
#   server.resource_url: https://<KAMPUS_DOMAIN>/mcp
#   auth.issuer:         https://<AUTH_DOMAIN>/realms/kampus
# (hosts ending in .invalid are rejected at startup as unfilled placeholders).
version: 1

school:
  id: temple
  display_name: Temple University
  timezone: America/New_York

server:
  resource_url: http://127.0.0.1:8080/mcp
  listen: 127.0.0.1:8080
  admin_listen: 127.0.0.1:8081

auth:
  mode: oauth
  issuer: http://127.0.0.1:8180/realms/kampus

modules: [rooms, courses, transit, library_hours, deadlines]

sandbox:
  enabled: false

mascot:
  name: Owl
  persona: A friendly campus owl. Answers in one or two short sentences.

libcal:
  enabled: true
  base_url: https://charlesstudy.temple.edu
  locations:
    - id: "8404"
      name: Charles Library
      aliases: [Charles, Charles Library, main library]
  default_location: "8404"
  booking_simulation: false

banner:
  enabled: true
  base_url: https://prd-xereg.temple.edu/StudentRegistrationSsb/ssb
  default_term: "202636"
  allowed_terms: ["202636"]

hours:
  enabled: true
  libraries:
    - id: charles
      name: Charles Library
      url: https://library.temple.edu/hours
      parser:
        profile: dated-week-grid
        selectors:
          range: '.date-range'
          dates: '.buildings.d-lg-block > .row:nth-child(2) .hours-dates'
          rows: '.buildings.d-lg-block .hours-row'
          library: "h3 a[href='/libraries/charles-library']"
          cells: ':scope > .col'
      aliases: [Charles, main library]
  default_library: charles

transit:
  enabled: true
  providers:
    - id: septa_rail
      kind: septa_arrivals
      base_url: https://www3.septa.org
    - id: septa_gtfs
      kind: gtfs_static
    - id: flight
      kind: transloc_relay
      base_url: https://flight.transloc.com
      service_window: { start: "18:00:00", end: "02:00:00" }
  stops:
    - id: Temple University
      name: Temple University Station
      provider: septa_rail
      aliases: [Temple, Temple Station, Temple University Station]
    # GTFS stop 53 is the route 3 bus; the B at Cecil B. Moore is 32148 (north) and 1277 (south).
    - id: "32148"
      name: Cecil B. Moore northbound
      provider: septa_gtfs
      aliases: [Cecil B Moore, Cecil B. Moore, CBM north]
    - id: "1277"
      name: Cecil B. Moore southbound
      provider: septa_gtfs
      aliases: [Cecil B Moore, Cecil B. Moore, CBM south]
    - id: flight
      name: Flight shuttle
      provider: flight
      aliases: [Flight, shuttle]
  routes:
    - id: B1
      provider: septa_gtfs
      aliases: [B, the B, BSL, Broad Street Line, orange line]
  gtfs_subset_path: fixtures/septa/20260926T210752721463Z-gtfs-subset
  gtfs_validity: { start: "2026-09-06", end: "2027-02-20" }
  # Sandbox config only, also requiring sandbox.enabled: true:
  # replay_path: fixtures/flight/20260926T225527128011Z-vehicle-points

devices: []
